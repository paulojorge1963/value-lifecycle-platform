name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck & lint
    runs-on: ubuntu-latest
    env:
      # `prisma generate` resolves env("DATABASE_URL") from the schema. It never
      # connects to a database to generate the client, so a dummy URL is fine.
      DATABASE_URL: postgresql://user:pass@localhost:5432/db?schema=public
      AUTH_SECRET: ci-placeholder-not-used
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

  build:
    name: Smoke build
    needs: check
    runs-on: ubuntu-latest
    env:
      # Dummy values — `next build` doesn't query the DB (all data pages are
      # force-dynamic), and Auth.js only needs a secret to be present at build.
      DATABASE_URL: postgresql://user:pass@localhost:5432/db?schema=public
      AUTH_SECRET: ci-placeholder-not-used
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (smoke test)
        run: npm run build
