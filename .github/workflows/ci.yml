name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck & lint
    runs-on: ubuntu-latest
    env:
      # `prisma generate` resolves env("DATABASE_URL") from the schema. It never
      # connects to a database to generate the client, so a dummy URL is fine.
      DATABASE_URL: postgresql://user:pass@localhost:5432/db?schema=public
      AUTH_SECRET: ci-placeholder-not-used
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint
