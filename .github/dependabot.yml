version: 2
updates:
  # Application dependencies (package.json)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Batch low-risk minor/patch bumps into a single PR to cut noise.
      # Major bumps still open their own PR so they can be reviewed individually.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Framework majors (Next, Tailwind, ESLint, React) are deliberate, tested
      # migrations — keep them out of auto-batched PRs so each is reviewed on its
      # own. (Next 15→16, Tailwind 3→4 and ESLint 8→9 were done in v0.7.0.)
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-config-next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  # GitHub Actions used in workflows (actions/checkout, actions/setup-node, …)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci(deps)"
