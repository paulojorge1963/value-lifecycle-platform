  <rect width="1180" height="470" fill="#FFFFFF"/>
  <rect x="30" y="60" width="470" height="360" rx="10" ry="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><rect x="30" y="60" width="470" height="56" rx="10" ry="10" fill="#2563EB" stroke="#1E40AF" stroke-width="0"/><rect x="30" y="100" width="470" height="16" fill="#EFF6FF"/><text x="265" y="93.049" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Value Engineer — 8-phase VE Job Plan</text><text x="64" y="155" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#0F172A" text-anchor="start">1 · Orientation — scope, stakeholders, target</text><text x="64" y="184.725" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#0F172A" text-anchor="start">2 · Information — cost &amp; performance facts</text><text x="64" y="214.45" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#0F172A" text-anchor="start">3 · Function analysis — verb-noun, FAST, value index</text><text x="64" y="244.17499999999998" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#0F172A" text-anchor="start">4 · Creative — generate alternatives</text><text x="64" y="273.9" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#0F172A" text-anchor="start">5 · Evaluation — weighted scoring &amp; shortlist</text><text x="64" y="303.625" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#0F172A" text-anchor="start">6 · Development — recommendations &amp; business case</text><text x="64" y="333.35" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#0F172A" text-anchor="start">7 · Presentation — reviewer accept / reject</text><text x="64" y="363.07500000000005" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#0F172A" text-anchor="start">8 · Handover — baselines, KPIs, success criteria</text><rect x="680" y="60" width="470" height="360" rx="10" ry="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/><rect x="680" y="60" width="470" height="56" rx="10" ry="10" fill="#059669" stroke="#1E40AF" stroke-width="0"/><rect x="680" y="100" width="470" height="16" fill="#ECFDF5"/><text x="915" y="92.75200000000001" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Value Realization Manager — 7-phase lifecycle</text><text x="714" y="155" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#0F172A" text-anchor="start">1 · Intake &amp; alignment — confirm objectives</text><text x="714" y="189.075" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#0F172A" text-anchor="start">2 · Baseline &amp; measurement — validate baselines</text><text x="714" y="223.14999999999998" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#0F172A" text-anchor="start">3 · Implementation planning — work packages</text><text x="714" y="257.22499999999997" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#0F172A" text-anchor="start">4 · Adoption &amp; change — training, comms, champions</text><text x="714" y="291.29999999999995" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#0F172A" text-anchor="start">5 · Execution &amp; monitoring — status &amp; health</text><text x="714" y="325.37499999999994" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#0F172A" text-anchor="start">6 · Value tracking &amp; reporting — KPI actuals, QBR</text><text x="714" y="359.44999999999993" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#0F172A" text-anchor="start">7 · Close-out — realized value vs business case</text><line x1="502" y1="235" x2="520" y2="235" stroke="#2563EB" stroke-width="2" marker-end="url(#arwVE)"/><rect x="520" y="175" width="140" height="120" rx="12" ry="12" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/><text x="590" y="215.83" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#D97706" text-anchor="middle">HANDOVER</text><text x="590" y="233.164" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="middle">first-class</text><text x="590" y="248.878" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" fill="#0F172A" text-anchor="middle">≥1 accepted</text><text x="590" y="264.403" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" fill="#0F172A" text-anchor="middle">recommendation</text><line x1="660" y1="235" x2="678" y2="235" stroke="#059669" stroke-width="2" marker-end="url(#arwVR)"/><text x="590" y="40" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#64748B" text-anchor="middle">One workspace, the whole value lifecycle — every realization track traces back to its source study.</text>
