  <rect width="1180" height="470" fill="#FFFFFF"/><text x="590" y="34" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#64748B" text-anchor="middle">One workspace, the whole value lifecycle — every realization effort traces back to the study it came from.</text><rect x="30" y="58" width="480" height="372" rx="10" ry="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><rect x="30" y="58" width="480" height="52" rx="10" ry="10" fill="#2563EB"/><rect x="30" y="96" width="480" height="14" fill="#EFF6FF"/><text x="270" y="88.42200000000001" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">VALUE ENGINEERING — 8-phase Job Plan</text><text x="60" y="146" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#0F172A" text-anchor="start">1 · Orientation — scope, stakeholders, target</text><text x="60" y="176.74" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#0F172A" text-anchor="start">2 · Information — current-state cost &amp; pain</text><text x="60" y="207.48000000000002" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#0F172A" text-anchor="start">3 · Function analysis — where value hides</text><text x="60" y="238.22000000000003" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#0F172A" text-anchor="start">4 · Creative — generate alternatives</text><text x="60" y="268.96000000000004" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#0F172A" text-anchor="start">5 · Evaluation — score &amp; shortlist</text><text x="60" y="299.70000000000005" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#0F172A" text-anchor="start">6 · Development — recommendations &amp; business case</text><text x="60" y="330.44000000000005" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#0F172A" text-anchor="start">7 · Presentation — reviewer accept / reject</text><text x="60" y="361.18000000000006" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#0F172A" text-anchor="start">8 · Handover — baselines, KPIs, success criteria</text><rect x="670" y="58" width="480" height="372" rx="10" ry="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/><rect x="670" y="58" width="480" height="52" rx="10" ry="10" fill="#059669"/><rect x="670" y="96" width="480" height="14" fill="#ECFDF5"/><text x="910" y="88.42200000000001" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">VALUE REALIZATION — 7-phase lifecycle</text><text x="700" y="146" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#0F172A" text-anchor="start">1 · Intake &amp; alignment — confirm objectives</text><text x="700" y="180.8" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#0F172A" text-anchor="start">2 · Baseline &amp; measurement — validate baselines</text><text x="700" y="215.60000000000002" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#0F172A" text-anchor="start">3 · Implementation planning — work packages</text><text x="700" y="250.40000000000003" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#0F172A" text-anchor="start">4 · Adoption &amp; change — training, comms, champions</text><text x="700" y="285.20000000000005" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#0F172A" text-anchor="start">5 · Execution &amp; monitoring — status &amp; health</text><text x="700" y="320.00000000000006" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#0F172A" text-anchor="start">6 · Value tracking &amp; reporting — KPI actuals, QBR</text><text x="700" y="354.80000000000007" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#0F172A" text-anchor="start">7 · Close-out — realized value vs the business case</text><line x1="513" y1="241" x2="520" y2="241" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arwB)"/><rect x="520" y="179" width="132" height="124" rx="14" ry="14" fill="#FFF7ED" stroke="#D97706" stroke-width="2"/><text x="586" y="214.97719999999998" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#D97706" text-anchor="middle">HANDOVER</text><text x="586" y="231.3252" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="middle">governance</text><text x="586" y="246.7352" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="middle">gate</text><text x="586" y="261.66279999999995" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#0F172A" text-anchor="middle">≥1 accepted</text><text x="586" y="276.40279999999996" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#0F172A" text-anchor="middle">recommendation</text><line x1="652" y1="241" x2="667" y2="241" stroke="#059669" stroke-width="2.2" marker-end="url(#arwT)"/></svg>